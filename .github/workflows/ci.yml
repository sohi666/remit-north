name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Typecheck, tests, levels, store metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Verify tax pack
        run: npm run verify:pack

      - name: Store metadata lint
        run: node scripts/check-store-metadata.mjs

      - name: Release tooling syntax
        run: |
          node --check scripts/store-status.mjs
          node --check scripts/check-store-metadata.mjs
          for f in scripts/notify.sh scripts/ci/*.sh; do bash -n "$f"; done
          for f in fastlane/Fastfile fastlane/Appfile Gemfile; do ruby -c "$f"; done

      - name: Expo doctor (non-blocking)
        continue-on-error: true
        run: npx --yes expo-doctor
